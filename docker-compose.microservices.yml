services:
  gateway:
    image: mini-drop-microservices-test:latest
    pid: host
    command: ["uvicorn", "microservices_test.gateway:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      ORDER_URL: http://order:8080
      INVENTORY_URL: http://inventory:8080
      PAYMENT_URL: http://payment:8080
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz').read()\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  order:
    image: mini-drop-microservices-test:latest
    pid: host
    command: ["uvicorn", "microservices_test.order:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "18081:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz').read()\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  inventory:
    image: mini-drop-microservices-test:latest
    pid: host
    command: ["uvicorn", "microservices_test.inventory:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "18082:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz').read()\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  payment:
    image: mini-drop-microservices-test:latest
    pid: host
    command: ["uvicorn", "microservices_test.payment:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "18083:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz').read()\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  loadgen:
    image: mini-drop-microservices-test:latest
    pid: host
    command: ["uvicorn", "microservices_test.loadgen:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      GATEWAY_URL: http://gateway:8080
      LOADGEN_AUTO_START: "1"
      LOADGEN_PLAN: cpu_hotspot,offcpu_wait,chain,conflict,line_hotspot,repeat
      LOADGEN_REQUEST_GAP_SEC: "0.35"
      LOADGEN_CYCLE_DELAY_SEC: "1.5"
      LOADGEN_REQUEST_TIMEOUT_SEC: "20"
    ports:
      - "18084:8080"
    depends_on:
      gateway:
        condition: service_healthy
      order:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/status').read()\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
