services:
  dependency:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@dependency:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://dependency:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: yes
  target:
    build: {context: ., dockerfile: Dockerfile}
    environment:
      CASE_EVIDENCE_ROOT: /evidence
      CASE_DURATION_SEC: ${CASE_DURATION_SEC:-180}
      KAFKA_BOOTSTRAP_SERVERS: dependency:9092
    volumes:
      - ${PROJECT_SOURCE_ROOT:?set PROJECT_SOURCE_ROOT}:/opt/project:ro
      - ${CASE_EVIDENCE_ROOT:-./evidence}:/evidence
    depends_on: [dependency]
    command: ["python", "/case/kafka_workload.py"]
  monitor:
    image: pr_kafka_2286-target
    pid: "service:target"
    environment:
      CASE_EVIDENCE_ROOT: /evidence
      CASE_DURATION_SEC: ${CASE_DURATION_SEC:-180}
      TARGET_PROCESS_PATTERN: kafka_workload.py
    volumes: ["${CASE_EVIDENCE_ROOT:-./evidence}:/evidence"]
    command: ["python", "/case/monitor.py"]
