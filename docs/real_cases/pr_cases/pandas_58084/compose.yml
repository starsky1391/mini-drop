services:
  target:
    build: {context: ., dockerfile: Dockerfile}
    environment:
      CASE_EVIDENCE_ROOT: /evidence
      CASE_DURATION_SEC: ${CASE_DURATION_SEC:-180}
    volumes:
      - ${CASE_EVIDENCE_ROOT:-./evidence}:/evidence
    command: ["python", "/case/pandas_groupby_workload.py"]
  monitor:
    image: pr_pandas_58084-target
    pid: "service:target"
    environment:
      CASE_EVIDENCE_ROOT: /evidence
      CASE_DURATION_SEC: ${CASE_DURATION_SEC:-180}
      TARGET_PROCESS_PATTERN: pandas_groupby_workload.py
    volumes: ["${CASE_EVIDENCE_ROOT:-./evidence}:/evidence"]
    command: ["python", "/case/monitor.py"]
  dependency:
    image: alpine:3.20
    command: ["sh", "-c", "sleep 100000"]
