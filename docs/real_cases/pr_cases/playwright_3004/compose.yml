services:
  target:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CASE_EVIDENCE_ROOT: /evidence
      CASE_DURATION_SEC: ${CASE_DURATION_SEC:-180}
    volumes:
      - ${PROJECT_SOURCE_ROOT:?set PROJECT_SOURCE_ROOT}:/opt/project:ro
      - ${CASE_EVIDENCE_ROOT:-./evidence}:/evidence
    command: ["python", "/case/playwright_workload.py"]

  monitor:
    image: pr_playwright_3004-target
    pid: "service:target"
    environment:
      CASE_EVIDENCE_ROOT: /evidence
      CASE_DURATION_SEC: ${CASE_DURATION_SEC:-180}
      TARGET_PROCESS_PATTERN: playwright_workload.py
    volumes:
      - ${CASE_EVIDENCE_ROOT:-./evidence}:/evidence
    command: ["python", "/case/monitor.py"]

  dependency:
    image: alpine:3.20
    command: ["sh", "-c", "sleep 100000"]
