[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              ${MINI_DROP_LOG_PATHS}
    Tag               mini_drop.logs
    Refresh_Interval  5
    Rotate_Wait       30
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    DB                /buffers/fluent-bit-state.db
    Parser            docker_or_plain

[OUTPUT]
    Name   file
    Match  mini_drop.logs
    Path   /buffers
    File   logs.ndjson
    Format out_file
